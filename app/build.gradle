plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'trust.me.broadcaster'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "trust.me.broadcaster"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "3.0"
    }

    signingConfigs {
        release {
            storeFile file(env.fetch("RELEASE_JKS_FILE"))
            storePassword env.fetch("RELEASE_JKS_PASS")
            keyAlias env.fetch("RELEASE_KEY_ALIS")
            keyPassword env.fetch("RELEASE_KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            resValue("string", "app_name", "Broadcaster Debug")
            resValue("string", "title_activity_bug", "BugActivity Debug")
            resValue("string", "title_service_notification", "MonitorNotificationService Debug")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
        resValues = true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Broadcaster-${variant.name}-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons
    implementation libs.androidx.work.runtime.ktx
    implementation libs.gson
    implementation libs.luaj.jse

    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling
}
